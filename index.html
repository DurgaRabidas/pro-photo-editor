<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#fff;text-align:center;margin:0}
canvas{background:#222;max-width:100%;max-height:70vh}
button,input{margin:5px;padding:8px}
#tools{display:none}
</style>
</head>
<body>
<h3>Photo Editor</h3>
<input type="file" id="up">
<br>
<canvas id="c"></canvas>
<br>
<div id="tools">
<button onclick="mode='draw'">Draw</button>
<input type="color" id="col" value="#ff0000">
<input type="range" id="size" min="1" max="30" value="5">
<button onclick="mode='text'">Add Text</button>
<button onclick="rot+=10;draw()">Rotate</button>
<button onclick="skx+=0.1;draw()">Skew</button>
<button onclick="download()">Save</button>
</div>

<script>
let c=document.getElementById('c'),x=c.getContext('2d'),img=new Image(),mode='edit',drawing=0,rot=0,skx=0;
let draws=[],texts=[],col="#ff0000",bs=5;

document.getElementById('up').onchange=e=>{img.src=URL.createObjectURL(e.target.files[0])}
img.onload=()=>{c.width=img.width;c.height=img.height;document.getElementById('tools').style.display='block';draw()}
document.getElementById('col').oninput=e=>col=e.target.value
document.getElementById('size').oninput=e=>bs=e.target.value

function draw(){
 x.clearRect(0,0,c.width,c.height);
 x.save();
 x.translate(c.width/2,c.height/2);
 x.rotate(rot*Math.PI/180);
 x.transform(1,0,skx,1,0,0);
 x.drawImage(img,-img.width/2,-img.height/2);
 x.restore();

 x.save();
 x.translate(c.width/2,c.height/2);
 x.rotate(rot*Math.PI/180);
 x.transform(1,0,skx,1,0,0);
 draws.forEach(d=>{x.strokeStyle=d.c;x.lineWidth=d.s;x.beginPath();d.p.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()})
 texts.forEach(t=>{x.fillStyle=t.c;x.font=t.s+"px Arial";x.fillText(t.txt,t.x,t.y)})
 x.restore();
}

c.onmousedown=e=>{if(mode=='draw'){drawing=1;draws.push({c:col,s:bs,p:[{x:e.offsetX-c.width/2,y:e.offsetY-c.height/2}]})}}
c.onmousemove=e=>{if(drawing){draws[draws.length-1].p.push({x:e.offsetX-c.width/2,y:e.offsetY-c.height/2});draw()}}
c.onmouseup=()=>{drawing=0}

function addText(){
 let t=prompt("Text:"); if(t){texts.push({txt:t,x:0,y:0,c:col,s:30});draw()}
}
document.querySelector("button[onclick=\"mode='text'\"]").onclick=addText

function download(){let a=document.createElement('a');a.download="pic.jpg";a.href=c.toDataURL();a.click()}
</script>
</body>
</html>
