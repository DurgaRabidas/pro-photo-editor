<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Scanner & Perspective Correction</title>
    <!-- OpenCV.js for robust edge detection and perspective warp -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        h2 {
            margin-bottom: 12px;
            font-size: 1.2rem;
            color: #e0e0e0;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, label.upload-btn {
            background-color: #1e88e5;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover, label.upload-btn:hover {
            background-color: #1565c0;
        }
        button:disabled {
            background-color: #424242;
            cursor: not-allowed;
        }
        input[type="file"] {
            display: none;
        }
        .stage-container {
            position: relative;
            max-width: 100%;
            max-height: 70vh;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            max-width: 100%;
            max-height: 70vh;
            display: block;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: auto;
            touch-action: none;
        }
        .status-box {
            margin-top: 12px;
            padding: 10px 14px;
            background: #1e1e1e;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #b0bec5;
            max-width: 600px;
            text-align: center;
        }
        #outputCanvas {
            margin-top: 16px;
            display: none;
            border: 2px solid #333;
        }
    </style>
</head>
<body>

    <h2>Pro Document Scanner</h2>

    <div class="controls">
        <label class="upload-btn">
            📷 Select Image
            <input type="file" id="fileInput" accept="image/*">
        </label>
        <button id="detectBtn" disabled>Auto-Detect Edges</button>
        <button id="cropBtn" disabled>Crop & Straighten</button>
        <button id="resetBtn" disabled>Reset Corners</button>
    </div>

    <div class="stage-container">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <canvas id="outputCanvas"></canvas>

    <div class="status-box" id="status">Loading OpenCV.js core engine...</div>

    <script>
        let cvReady = false;
        let imgElement = new Image();
        let corners = []; // [{x, y}, {x, y}, {x, y}, {x, y}] normalized to image coordinates
        let activeCorner = -1;

        const imageCanvas = document.getElementById('imageCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const outputCanvas = document.getElementById('outputCanvas');
        const imgCtx = imageCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');
        const statusEl = document.getElementById('status');

        const detectBtn = document.getElementById('detectBtn');
        const cropBtn = document.getElementById('cropBtn');
        const resetBtn = document.getElementById('resetBtn');

        function onOpenCvReady() {
            cvReady = true;
            statusEl.innerText = "Scanner Ready. Upload or capture a document to begin.";
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (evt) => {
                imgElement.onload = () => {
                    setupCanvases();
                    if (cvReady) {
                        autoDetectCorners();
                    } else {
                        resetCornersDefault();
                    }
                    detectBtn.disabled = false;
                    cropBtn.disabled = false;
                    resetBtn.disabled = false;
                };
                imgElement.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        function setupCanvases() {
            const containerWidth = imgElement.width;
            const containerHeight = imgElement.height;

            imageCanvas.width = containerWidth;
            imageCanvas.height = containerHeight;
            overlayCanvas.width = containerWidth;
            overlayCanvas.height = containerHeight;

            imgCtx.drawImage(imgElement, 0, 0);
            outputCanvas.style.display = 'none';
        }

        function resetCornersDefault() {
            const w = imageCanvas.width;
            const h = imageCanvas.height;
            const padX = w * 0.1;
            const padY = h * 0.1;
            corners = [
                { x: padX, y: padY },         // Top-Left
                { x: w - padX, y: padY },     // Top-Right
                { x: w - padX, y: h - padY }, // Bottom-Right
                { x: padX, y: h - padY }      // Bottom-Left
            ];
            drawOverlay();
        }

        // OpenCV Edge Detection Algorithm tuned for documents
        function autoDetectCorners() {
            if (!cvReady) return;
            statusEl.innerText = "Detecting document boundary...";

            let src = cv.imread(imageCanvas);
            let gray = new cv.Mat();
            let blurred = new cv.Mat();
            let edges = new cv.Mat();

            // 1. Convert to Grayscale
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);

            // 2. Gaussian Blur to remove printed text noise
            cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);

            // 3. Canny Edge Detection
            cv.Canny(blurred, edges, 75, 200);

            // 4. Find Contours
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            let maxArea = 0;
            let bestApprox = null;

            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);

                // Filter out small bounding boxes (text blocks, minor objects)
                if (area > (src.rows * src.cols * 0.1)) {
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                    // Document boundary must be a 4-point convex polygon
                    if (approx.rows === 4 && area > maxArea) {
                        maxArea = area;
                        if (bestApprox) bestApprox.delete();
                        bestApprox = approx;
                    } else {
                        approx.delete();
                    }
                }
                cnt.delete();
            }

            if (bestApprox) {
                let points = [];
                for (let i = 0; i < 4; i++) {
                    points.push({
                        x: bestApprox.data32S[i * 2],
                        y: bestApprox.data32S[i * 2 + 1]
                    });
                }
                corners = sortCorners(points);
                bestApprox.delete();
                statusEl.innerText = "Edges auto-detected! Nudge corners manually if needed.";
            } else {
                statusEl.innerText = "Could not confidently locate document edges. Defaulting to frame bounds.";
                resetCornersDefault();
            }

            // Cleanup memory
            src.delete(); gray.delete(); blurred.delete(); edges.delete();
            contours.delete(); hierarchy.delete();

            drawOverlay();
        }

        // Sort corners into [Top-Left, Top-Right, Bottom-Right, Bottom-Left]
        function sortCorners(pts) {
            pts.sort((a, b) => a.y - b.y);
            let topTwo = pts.slice(0, 2).sort((a, b) => a.x - b.x);
            let bottomTwo = pts.slice(2, 4).sort((a, b) => b.x - a.x);
            return [topTwo[0], topTwo[1], bottomTwo[0], bottomTwo[1]];
        }

        // Overlay Rendering (Polygon & Custom Drag Handles)
        function drawOverlay() {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            if (corners.length !== 4) return;

            // Translucent Mask
            overlayCtx.fillStyle = 'rgba(76, 175, 80, 0.2)';
            overlayCtx.strokeStyle = '#00e676';
            overlayCtx.lineWidth = Math.max(2, imageCanvas.width * 0.004);

            overlayCtx.beginPath();
            overlayCtx.moveTo(corners[0].x, corners[0].y);
            overlayCtx.lineTo(corners[1].x, corners[1].y);
            overlayCtx.lineTo(corners[2].x, corners[2].y);
            overlayCtx.lineTo(corners[3].x, corners[3].y);
            overlayCtx.closePath();
            overlayCtx.fill();
            overlayCtx.stroke();

            // Draw Handles
            const colors = ['#00e676', '#ffeb3b', '#00e676', '#00e676'];
            const handleRadius = Math.max(10, imageCanvas.width * 0.015);

            corners.forEach((pt, i) => {
                overlayCtx.beginPath();
                overlayCtx.arc(pt.x, pt.y, handleRadius, 0, 2 * Math.PI);
                overlayCtx.fillStyle = colors[i];
                overlayCtx.shadowColor = 'rgba(0,0,0,0.5)';
                overlayCtx.shadowBlur = 6;
                overlayCtx.fill();
                overlayCtx.lineWidth = 2;
                overlayCtx.strokeStyle = '#ffffff';
                overlayCtx.stroke();
                overlayCtx.shadowBlur = 0;
            });
        }

        // Perspective Transformation Matrix Warp
        function cropAndWarp() {
            if (!cvReady || corners.length !== 4) return;

            let src = cv.imread(imageCanvas);
            
            // Calculate destination rectangle dimensions
            let w1 = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
            let w2 = Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y);
            let maxWidth = Math.max(w1, w2);

            let h1 = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
            let h2 = Math.hypot(corners[2].x - corners[1].x, corners[2].y - corners[1].y);
            let maxHeight = Math.max(h1, h2);

            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                corners[0].x, corners[0].y,
                corners[1].x, corners[1].y,
                corners[2].x, corners[2].y,
                corners[3].x, corners[3].y
            ]);

            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                0, 0,
                maxWidth - 1, 0,
                maxWidth - 1, maxHeight - 1,
                0, maxHeight - 1
            ]);

            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let dst = new cv.Mat();
            let dsize = new cv.Size(maxWidth, maxHeight);

            cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

            cv.imshow(outputCanvas, dst);
            outputCanvas.style.display = 'block';
            statusEl.innerText = "Warp complete! Transformed image output generated below.";

            src.delete(); dst.delete(); M.delete(); srcTri.delete(); dstTri.delete();
        }

        // Touch & Drag Handling for Handles
        function getCanvasPoint(evt) {
            const rect = overlayCanvas.getBoundingClientRect();
            const scaleX = overlayCanvas.width / rect.width;
            const scaleY = overlayCanvas.height / rect.height;

            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(e) {
            const pt = getCanvasPoint(e);
            const threshold = Math.max(30, imageCanvas.width * 0.04);
            activeCorner = corners.findIndex(c => Math.hypot(c.x - pt.x, c.y - pt.y) < threshold);
        }

        function handlePointerMove(e) {
            if (activeCorner === -1) return;
            e.preventDefault();
            const pt = getCanvasPoint(e);
            corners[activeCorner] = {
                x: Math.min(Math.max(0, pt.x), imageCanvas.width),
                y: Math.min(Math.max(0, pt.y), imageCanvas.height)
            };
            drawOverlay();
        }

        function handlePointerUp() {
            activeCorner = -1;
        }

        overlayCanvas.addEventListener('mousedown', handlePointerDown);
        overlayCanvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        overlayCanvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        overlayCanvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);

        detectBtn.addEventListener('click', autoDetectCorners);
        resetBtn.addEventListener('click', resetCornersDefault);
        cropBtn.addEventListener('click', cropAndWarp);
    </script>
</body>
</html>
