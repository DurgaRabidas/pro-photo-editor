<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Editor</title>
<style>
    body { background: #222; color: white; margin: 0; text-align: center; font-family: Arial; padding-bottom: 120px; }
    #canvas { background: #000; max-width: 95%; margin: 10px auto; display: block; }
  .toolbar {
        padding: 10px;
        background: #333;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    button { padding: 10px 12px; margin: 4px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 13px; }
    button:disabled { background: #555; }
    input { margin: 10px; }
</style>
</head>
<body>
    <h2>Photo Editor</h2>
    <input type="file" id="upload" accept="image/*">
    <canvas id="canvas"></canvas>

    <div class="toolbar">
        <button onclick="undo()" id="undoBtn" disabled>Undo</button>
        <button onclick="redo()" id="redoBtn" disabled>Redo</button>
        <button onclick="zoom(1.2)">Zoom +</button>
        <button onclick="zoom(0.8)">Zoom -</button>
        <button onclick="rotate()">Rotate</button>
        <button onclick="flip()">Flip</button>
        <button onclick="adjust(20,0)">B+</button>
        <button onclick="adjust(-20,0)">B-</button>
        <button onclick="adjust(0,20)">C+</button>
        <button onclick="adjust(0,-20)">C-</button>
        <button onclick="filter('grayscale(100%)')">Gray</button>
        <button onclick="filter('sepia(100%)')">Sepia</button>
        <button onclick="filter('blur(3px)')">Blur</button>
        <button onclick="download()">Save</button>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let history = [];
let step = -1;
let img = new Image();
let scale = 1;

document.getElementById('upload').onchange = function(e) {
    const reader = new FileReader();
    reader.onload = function(event) {
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            draw();
            save();
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
}

function save() {
    history = history.slice(0, step + 1);
    history.push(canvas.toDataURL());
    step++;
    document.getElementById('undoBtn').disabled = step <= 0;
    document.getElementById('redoBtn').disabled = step >= history.length - 1;
}

function load(s) {
    let newImg = new Image();
    newImg.src = history[s];
    newImg.onload = function() {
        img = newImg;
        scale = 1;
        draw();
    }
}

function undo() {
    if(step > 0) { step--; load(step); document.getElementById('undoBtn').disabled = step <= 0; document.getElementById('redoBtn').disabled = false; }
}
function redo() {
    if(step < history.length - 1) { step++; load(step); document.getElementById('redoBtn').disabled = step >= history.length - 1; document.getElementById('undoBtn').disabled = false; }
}

function zoom(f) {
    scale = scale * f;
    if(scale < 0.5) scale = 0.5;
    if(scale > 3) scale = 3;
    draw();
}

function rotate() {
    let t = document.createElement('canvas');
    t.width = canvas.height; t.height = canvas.width;
    let tctx = t.getContext('2d');
    tctx.translate(t.width/2, t.height/2); tctx.rotate(90*Math.PI/180);
    tctx.drawImage(canvas, -canvas.width/2, -canvas.height/2);
    img.src = t.toDataURL(); img.onload = () => { canvas.width = img.width; canvas.height = img.height; draw(); save(); }
}

function flip() {
    let t = document.createElement('canvas');
    t.width = canvas.width; t.height = canvas.height;
    let tctx = t.getContext('2d');
    tctx.translate(canvas.width, 0); tctx.scale(-1, 1);
    tctx.drawImage(canvas, 0, 0);
    img.src = t.toDataURL(); img.onload = () => { draw(); save(); }
}

function adjust(b, c) {
    let t = document.createElement('canvas'); t.width = canvas.width; t.height = canvas.height;
    let tctx = t.getContext('2d'); tctx.drawImage(canvas, 0, 0);
