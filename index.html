<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Editor</title>
<style>
    body { background: #222; color: white; margin: 0; text-align: center; font-family: Arial; }
    #canvas { background: #000; max-width: 100%; margin: 10px 0; }
   .toolbar { padding: 10px; background: #333; }
    button { padding: 10px; margin: 5px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; }
</style>
</head>
<body>
    <h2>Photo Editor</h2>
    <input type="file" id="upload" accept="image/*">
    <br>
    <canvas id="canvas"></canvas>
    <br>

    <div class="toolbar">
        <button onclick="zoom(1.2)">Zoom +</button>
        <button onclick="zoom(0.8)">Zoom -</button>
        <button onclick="bright(20)">B+</button>
        <button onclick="bright(-20)">B-</button>
        <button onclick="contrast(20)">C+</button>
        <button onclick="contrast(-20)">C-</button>
        <button onclick="saveImg()">Save</button>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let originalImg = new Image();
let currentScale = 1;

document.getElementById('upload').onchange = function(e) {
    let file = e.target.files[0];
    let url = URL.createObjectURL(file); // Ye sabse fast tarika hai
    originalImg.onload = function() {
        canvas.width = originalImg.width;
        canvas.height = originalImg.height;
        draw();
    }
    originalImg.src = url;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(originalImg, 0, 0, canvas.width*currentScale, canvas.height*currentScale);
}

function zoom(f) {
    currentScale = currentScale * f;
    if(currentScale < 0.5) currentScale = 0.5;
    if(currentScale > 3) currentScale = 3;
    draw();
}

function bright(val) {
    ctx.filter = `brightness(${100 + val}%)`;
    draw();
    ctx.filter = 'none';
}

function contrast(val) {
    ctx.filter = `contrast(${100 + val}%)`;
    draw();
    ctx.filter = 'none';
}

function saveImg() {
    let a = document.createElement('a');
    a.download = 'photo.jpg';
    a.href = canvas.toDataURL();
    a.click();
}
</script>
</body>
</html>
