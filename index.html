<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Editor</title>
<style>
    body { background: #222; color: white; margin: 0; text-align: center; font-family: Arial; }
    #canvas { background: #000; max-width: 100%; margin: 10px 0; }
   .toolbar { padding: 10px; background: #333; }
    button { padding: 10px; margin: 5px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; }
    input { margin: 10px; }
</style>
</head>
<body>
    <h2>Photo Editor</h2>
    <input type="file" id="upload" accept="image/*">
    <br>
    <canvas id="canvas"></canvas>
    <br>

    <div class="toolbar">
        <button onclick="zoom(1.2)">Zoom +</button>
        <button onclick="zoom(0.8)">Zoom -</button>
        <button onclick="adjust(20,0)">B+</button>
        <button onclick="adjust(-20,0)">B-</button>
        <button onclick="adjust(0,20)">C+</button>
        <button onclick="adjust(0,-20)">C-</button>
        <button onclick="download()">Save</button>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
let scale = 1;

document.getElementById('upload').onchange = function(e) {
    const reader = new FileReader();
    reader.onload = function(event) {
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            draw();
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
}

function zoom(f) {
    scale = scale * f;
    if(scale < 0.5) scale = 0.5;
    if(scale > 3) scale = 3;
    draw();
}

function adjust(b, c) {
    let tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    let tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(canvas, 0, 0);

    let imageData = tempCtx.getImageData(0,0,canvas.width,canvas.height);
    let data = imageData.data;
    for(let i=0; i<data.length; i+=4){
        data[i] = data[i] + b + (data[i]-128)*c/100;
        data[i+1] = data[i+1] + b + (data[i+1]-128)*c/100;
        data[i+2] = data[i+2] + b + (data[i+2]-128)*c/100;
    }
    tempCtx.putImageData(imageData,0,0);

    img = new Image();
    img.src = tempCanvas.toDataURL();
    img.onload = draw;
}

function download() {
    let link = document.createElement('a');
    link.download = 'photo.jpg';
    link.href = canvas.toDataURL();
    link.click();
}
</script>
</body>
</html>
