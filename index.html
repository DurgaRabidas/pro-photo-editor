<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Photo Editor</title>
<meta name="theme-color" content="#222">
<link rel="manifest" href="manifest.json">
<style>
    body {
        font-family: Arial;
        background: #222;
        color: white;
        margin: 0;
        padding-bottom: 80px; /* toolbar ke liye jagah */
        text-align: center;
    }
    #canvas-container {
        overflow: auto;
        max-height: 50vh;
        background: #000;
        margin: 10px;
        border-radius: 10px;
    }
    canvas {
        background: #000;
        margin: 0;
        border-radius: 10px;
        transform-origin: 0 0;
        max-width: 100%;
    }
   .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 10px;
        background: #333;
        position: fixed; /* Neeche chipka do */
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
    }
    button, input {
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: #4CAF50;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }
    button:active { background: #45a049; }
    button:disabled { background: #555; }
    h2 { margin: 10px; }
</style>
</head>
<body>
    <h2>Pro Photo Editor</h2>
    <input type="file" id="upload" accept="image/*">

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="toolbar">
        <button onclick="undo()" id="undoBtn" disabled>Undo</button>
        <button onclick="redo()" id="redoBtn" disabled>Redo</button>
        <button onclick="zoom(1.2)">Zoom +</button>
        <button onclick="zoom(0.8)">Zoom -</button>
        <button onclick="rotate()">Rotate</button>
        <button onclick="flip()">Flip</button>
        <button onclick="adjust(20,0)">B+</button>
        <button onclick="adjust(-20,0)">B-</button>
        <button onclick="adjust(0,20)">C+</button>
        <button onclick="adjust(0,-20)">C-</button>
        <button onclick="filter('grayscale(100%)')">Gray</button>
        <button onclick="filter('sepia(100%)')">Sepia</button>
        <button onclick="filter('blur(3px)')">Blur</button>
        <button onclick="download()">Save</button>
        <button onclick="share()">Share</button>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');
let history = [];
let currentStep = -1;
let scale = 1;

document.getElementById('upload').onchange = e => {
    const reader = new FileReader();
    reader.onload = event => {
        const img = new Image();
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            scale = 1;
            canvas.style.transform = `scale(${scale})`;
            saveState();
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}

function saveState() {
    history = history.slice(0, currentStep + 1);
    history.push(canvas.toDataURL());
    currentStep++;
    updateButtons();
}

function updateButtons(){
    document.getElementById('undoBtn').disabled = currentStep <= 0;
    document.getElementById('redoBtn').disabled = currentStep >= history.length - 1;
}

function loadState(step){
    let img = new Image();
    img.src = history[step];
    img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img,0,0);
    }
}

function undo() {
    if(currentStep > 0){
        currentStep--;
        loadState(currentStep);
        updateButtons();
    }
}

function redo() {
    if(currentStep < history.length - 1){
        currentStep++;
        loadState(currentStep);
        updateButtons();
    }
}
