<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Photo Editor Ultra</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #121212; color: #eee; margin: 0; font-family: system-ui, sans-serif; }
    h2 { margin: 10px 0; text-align: center; font-size: 18px; font-weight: 600; }

  .main-wrap { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .canvas-wrap {
        flex: 1; display: flex; justify-content: center; align-items: center;
        position: relative; padding: 10px; overflow: hidden; background: #000; min-height: 200px;
    }
    #canvas {
        border-radius: 12px; background: #111; display: block; touch-action: none;
        max-width: 100%; max-height: 100%; width: auto; height: auto; cursor: grab;
    }
    #canvas.grabbing { cursor: grabbing; }

    #upload-label {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 16px 32px; background: #4CAF50; color: white;
        border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; z-index: 10; transition: 0.1s;
    }
    #upload-label:active { transform: translate(-50%, -50%) scale(0.95); }
    #upload { display: none; }

  .toolbar {
        background: #1f1f1f; padding: 10px; display: flex;
        gap: 8px; overflow-x: auto; border-top: 1px solid #333; flex-shrink: 0;
    }
  .toolbar::-webkit-scrollbar { height: 6px; }
  .toolbar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    button { padding: 12px 10px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 12px; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
    button.active { background: #ff9800; }
    button:active { background: #45a049; }
    button:disabled { background: #3a3a3a; color: #666; cursor: not-allowed; }
</style>
</head>
<body>
    <div class="main-wrap">
        <h2>📷 Photo Editor Ultra</h2>
        <div class="canvas-wrap" id="canvasWrap">
            <label for="upload" id="upload-label">📁 Choose Image</label>
            <input type="file" id="upload" accept="image/*">
            <canvas id="canvas"></canvas>
        </div>
        <div class="toolbar">
            <button onclick="setMode('edit')" id="editBtn" class="active">✋ Move</button>
            <button onclick="setMode('draw')" id="drawBtn">🖊️ Draw</button>
            <button onclick="addText()">T Text</button>
            <button onclick="undo()" id="undoBtn" disabled>↩️ Undo</button>
            <button onclick="redo()" id="redoBtn" disabled>↪️ Redo</button>
            <button onclick="zoom(1.25)">🔍 +</button>
            <button onclick="zoom(0.8)">🔍 -</button>
            <button onclick="rotate()">🔄 Rotate</button>
            <button onclick="flip()">↔️ Flip</button>
            
            <!-- NAYE FILTER BUTTONS -->
            <button onclick="setFilter('grayscale(100%)')">Gray</button>
            <button onclick="setFilter('blur(3px)')">Blur</button>
            <button onclick="setFilter('contrast(150%)')">Contrast</button>
            <button onclick="setFilter('brightness(130%)')">Bright</button>
            <button onclick="setFilter('sepia(100%)')">Sepia</button>
            <button onclick="reset()">Reset</button>
            <button onclick="saveImg()">💾 Save</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const uploadLabel = document.getElementById('upload-label');
let history = []; let step = -1;
let img = new Image();
let state = {scale: 1, filter: 'none', rotation: 0, flipped: 1, offsetX: 0, offsetY: 0};
let mode = 'edit';
let isDragging = false;
let lastX = 0, lastY = 0;

function fitCanvas() {
    if(!img.src) return;
    let w = img.width; let h = img.height;
    if(state.rotation % 180!== 0) [w, h] = [h, w];
    canvas.width = w;
    canvas.height = h;
}

document.getElementById('upload').onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    img.onload = () => {
        uploadLabel.style.display = 'none';
        history = []; step = -1;
        state = {scale: 1, filter: 'none', rotation: 0, flipped: 1, offsetX: 0, offsetY: 0};
        fitCanvas(); draw(); pushState();
        URL.revokeObjectURL(url);
    }
    img.src = url;
}

function draw() {
    if(!img.src) return;
    fitCanvas();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.filter = state.filter; // Yahi filter apply hota hai
    ctx.translate(canvas.width/2 + state.offsetX, canvas.height/2 + state.offsetY);
    ctx.scale(state.flipped * state.scale, state.scale);
    ctx.rotate(state.rotation * Math.PI / 180);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    ctx.restore();
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.touches? e.touches[0].clientX : e.clientX) - rect.left,
        y: (e.touches? e.touches[0].clientY : e.clientY) - rect.top
    };
}

canvas.onmousedown = canvas.ontouchstart = (e) => {
    if(mode!== 'edit') return;
    isDragging = true; canvas.classList.add('grabbing');
    const pos = getPos(e); lastX = pos.x; lastY = pos.y;
}

canvas.onmousemove = canvas.ontouchmove = (e) => {
    if(!isDragging || mode!== 'edit') return;
    e.preventDefault();
    const pos = getPos(e);
    state.offsetX += pos.x - lastX;
    state.offsetY += pos.y - lastY;
    lastX = pos.x; lastY = pos.y;
    draw();
}

canvas.onmouseup = canvas.ontouchend = () => {
    if(isDragging) { isDragging = false; canvas.classList.remove('grabbing'); pushState(); }
}

function pushState() {
    if(step < history.length - 1) history.length = step + 1;
    history.push(JSON.parse(JSON.stringify(state)));
    step++; updateBtns();
}
function restoreState(s) {
    state = JSON.parse(JSON.stringify(history[s])); draw(); updateBtns();
}
function updateBtns() {
    document.getElementById('undoBtn').disabled = step <= 0;
    document.getElementById('redoBtn').disabled = step >= history.length - 1;
}
