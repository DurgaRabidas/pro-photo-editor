<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Editor</title>
<style>
    body { background: #222; color: white; margin: 0; text-align: center; font-family: Arial; padding-bottom: 150px; }
    #canvas { background: #000; max-width: 95%; max-height: 60vh; margin: 10px auto; display: block; border-radius: 10px; }
   .toolbar {
        padding: 10px;
        background: #333;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
    }
    button { padding: 10px 12px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; }
    button:disabled { background: #555; color: #aaa; }
    input { margin: 10px; }
</style>
</head>
<body>
    <h2>Photo Editor</h2>
    <input type="file" id="upload" accept="image/*">
    <canvas id="canvas"></canvas>

    <div class="toolbar">
        <button onclick="undo()" id="undoBtn" disabled>Undo</button>
        <button onclick="redo()" id="redoBtn" disabled>Redo</button>
        <button onclick="zoom(1.2)">Zoom +</button>
        <button onclick="zoom(0.8)">Zoom -</button>
        <button onclick="rotate()">Rotate</button>
        <button onclick="flip()">Flip</button>
        <button onclick="setFilter('brightness(120%)')">B+</button>
        <button onclick="setFilter('brightness(80%)')">B-</button>
        <button onclick="setFilter('contrast(120%)')">C+</button>
        <button onclick="setFilter('contrast(80%)')">C-</button>
        <button onclick="setFilter('grayscale(100%)')">Gray</button>
        <button onclick="setFilter('sepia(100%)')">Sepia</button>
        <button onclick="setFilter('blur(3px)')">Blur</button>
        <button onclick="reset()">Reset</button>
        <button onclick="saveImg()">Save</button>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let history = [];
let step = -1;

let originalImg = new Image();
let state = {scale: 1, filter: 'none', rotation: 0, flipped: 1};

document.getElementById('upload').onchange = function(e) {
    let file = e.target.files[0];
    if(!file) return;
    let url = URL.createObjectURL(file);
    originalImg.onload = function() {
        canvas.width = originalImg.width;
        canvas.height = originalImg.height;
        state = {scale: 1, filter: 'none', rotation: 0, flipped: 1};
        history = [];
        step = -1;
        draw();
        saveState(); // sirf 1 baar save
    }
    originalImg.src = url;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.filter = state.filter;
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.scale(state.flipped * state.scale, state.scale);
    ctx.rotate(state.rotation * Math.PI/180);
    ctx.drawImage(originalImg, -originalImg.width/2, -originalImg.height/2);
    ctx.restore();
}

function saveState() {
    // agar same state hai to dubara save mat karo
    if(step >= 0 && JSON.stringify(history[step]) === JSON.stringify(state)) return;
    history = history.slice(0, step + 1);
    history.push(JSON.parse(JSON.stringify(state)));
    step++;
    updateButtons();
}

function loadState(s) {
    state = JSON.parse(JSON.stringify(history[s]));
    draw();
    updateButtons();
}

function updateButtons() {
    document.getElementById('undoBtn').disabled = step <= 0;
    document.getElementById('redoBtn').disabled = step >= history.length - 1;
}

function undo() {
    if(step > 0) { step--; loadState(step); }
}
function redo() {
    if(step < history.length - 1) { step++; loadState(step); }
}
