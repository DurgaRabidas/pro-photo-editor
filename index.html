<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Photo Editor Pro</title>
<style>
    * { box-sizing: border-box; }
    body { background: #121212; color: #eee; margin: 0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    h2 { margin: 10px 0; text-align: center; font-size: 18px; }

  .main-wrap { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .canvas-wrap {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        padding: 10px;
        overflow: auto;
        background: #000;
    }
    #canvas { border-radius: 12px; background: #000; display: block; }

    #upload-label {
        position: absolute;
        padding: 16px 32px;
        background: #4CAF50;
        color: white;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
        z-index: 10;
        box-shadow: 0 4px 15px rgba(76,175,80,0.3);
    }
    #upload-label:active { transform: scale(0.95); }
    #upload { display: none; }

  .toolbar {
        background: #1f1f1f;
        padding: 10px;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 80px;
        gap: 8px;
        overflow-x: auto;
        border-top: 1px solid #333;
        flex-shrink: 0;
    }
   .toolbar::-webkit-scrollbar { height: 4px; }
   .toolbar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    button { padding: 12px 6px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 11px; white-space: nowrap; }
    button:disabled { background: #3a3a3a; color: #666; }
    button:active { transform: scale(0.92); }
</style>
</head>
<body>
    <div class="main-wrap">
        <h2>📷 Photo Editor Pro</h2>
        <div class="canvas-wrap">
            <label for="upload" id="upload-label">📁 Choose Image</label>
            <input type="file" id="upload" accept="image/*">
            <canvas id="canvas"></canvas>
        </div>
        <div class="toolbar">
            <button onclick="undo()" id="undoBtn" disabled>↩️ Undo</button>
            <button onclick="redo()" id="redoBtn" disabled>↪️ Redo</button>
            <button onclick="zoom(1.25)">🔍 +</button>
            <button onclick="zoom(0.8)">🔍 -</button>
            <button onclick="rotate()">🔄 Rotate</button>
            <button onclick="flip()">↔️ Flip</button>
            <button onclick="setFilter('brightness(120%)')">B +</button>
            <button onclick="setFilter('brightness(80%)')">B -</button>
            <button onclick="setFilter('contrast(120%)')">C +</button>
            <button onclick="setFilter('contrast(80%)')">C -</button>
            <button onclick="setFilter('grayscale(100%)')">Gray</button>
            <button onclick="setFilter('sepia(100%)')">Sepia</button>
            <button onclick="setFilter('blur(2px)')">Blur</button>
            <button onclick="reset()">Reset</button>
