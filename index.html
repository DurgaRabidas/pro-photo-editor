<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Photo Editor Ultra</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #121212; color: #eee; margin: 0; font-family: system-ui, sans-serif; }
    h2 { margin: 10px 0; text-align: center; font-size: 18px; font-weight: 600; }

   .main-wrap { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
   .canvas-wrap {
        flex: 1; display: flex; justify-content: center; align-items: center;
        position: relative; padding: 10px; overflow: auto; background: #000; min-height: 200px;
    }
    #canvas {
        border-radius: 12px; background: #111; display: block; touch-action: none;
        max-width: 100%; max-height: 100%; width: auto; height: auto; cursor: grab;
    }
    #canvas.grabbing { cursor: grabbing; }

    #upload-label {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 16px 32px; background: #4CAF50; color: white;
        border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; z-index: 10; transition: 0.1s;
    }
    #upload-label:active { transform: translate(-50%, -50%) scale(0.95); }
    #upload { display: none; }

   .toolbar {
        background: #1f1f1f; padding: 10px; display: grid; grid-auto-flow: column;
        grid-auto-columns: 80px; gap: 8px; overflow-x: auto; border-top: 1px solid #333; flex-shrink: 0;
    }
   .toolbar::-webkit-scrollbar { height: 4px; }
   .toolbar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    button { padding: 12px 6px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 11px; white-space: nowrap; cursor: pointer; }
    button.active { background: #ff9800; }
    button:active { background: #45a049; }
    button:disabled { background: #3a3a3a; color: #666; cursor: not-allowed; }

   .text-input {
        position: absolute; background: transparent; border: 1px dashed #fff; color: white;
        font-size: 20px; padding: 5px; outline: none; z-index: 20;
    }
</style>
</head>
<body>
    <div class="main-wrap">
        <h2>📷 Photo Editor Ultra</h2>
        <div class="canvas-wrap" id="canvasWrap">
            <label for="upload" id="upload-label">📁 Choose Image</label>
            <input type="file" id="upload" accept="image/*">
            <canvas id="canvas"></canvas>
        </div>
        <div class="toolbar">
            <button onclick="setMode('edit')" id="editBtn" class="active">✋ Pan</button>
            <button onclick="setMode('draw')">🖊️ Draw</button>
            <button onclick="addText()">T Text</button>
            <button onclick="undo()" id="undo
