<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Editor Tested</title>
<style>
body {background:#121212; color:#fff; margin:0; font-family:system-ui; text-align:center}
#wrap {position:relative; width:100%; height:70vh; background:#000; display:flex; justify-content:center; align-items:center; overflow:hidden}
canvas {position:absolute; max-width:100%; max-height:100%; touch-action:none}
#tools {background:#1f1f1f; padding:10px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; border-top:1px solid #333}
button,input{padding:10px; border:none; border-radius:8px; background:#4CAF50; color:#fff; font-weight:600; cursor:pointer}
button:active{background:#45a049}
#upload-label{padding:16px 32px; background:#4CAF50; border-radius:12px; display:inline-block; margin:20px; font-weight:bold; cursor:pointer}
#upload{display:none}
</style>
</head>
<body>
<h3>📷 Photo Editor Tested</h3>

<div id="wrap">
    <canvas id="imgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
</div>
<label for="upload" id="upload-label">📁 Choose Image</label>
<input type="file" id="upload" accept="image/*">

<div id="tools">
    <input type="color" id="color" value="#ff0000" title="Brush Color">
    <input type="range" id="size" min="2" max="50" value="5" title="Brush Size">
    <button onclick="mode='draw'">🖊️ Draw</button>
    <button onclick="addText()">T Text</button>
    <button onclick="rotate(-5)">↪️ Rotate L</button>
    <button onclick="rotate(5)">↩️ Rotate R</button>
    <button onclick="skew(-0.1)">↗️ Skew L</button>
    <button onclick="skew(0.1)">↖️ Skew R</button>
    <button onclick="zoom(1.2)">🔍 +</button>
    <button onclick="zoom(0.8)">🔍 -</button>
    <button onclick="save()">💾 Save</button>
</div>

<script>
let imgCanvas = document.getElementById('imgCanvas');
let drawCanvas = document.getElementById('drawCanvas');
let ictx = imgCanvas.getContext('2d');
let dctx = drawCanvas.getContext('2d');
let img = new Image();
let scale=1, rot=0, sk=0, mode='edit', drawing=false;
let brushColor='#ff0000', brushSize=5;
let texts=[], paths=[]; // paths for undo

document.getElementById('color').oninput=e=>brushColor=e.target.value;
document.getElementById('size').oninput=e=>brushSize=e.target.value;

document.getElementById('upload').onchange=e=>{
    let file = e.target.files[0]; if(!file) return;
    img.src = URL.createObjectURL(file);
    document.getElementById('upload-label').style.display='none';
}
img.onload=()=>{
    imgCanvas.width = drawCanvas.width = img.width;
    imgCanvas.height = drawCanvas.height = img.height;
    drawImage();
}

function drawImage(){
    ictx.clearRect(0,0,imgCanvas.width,imgCanvas.height);
    ictx.save();
    ictx.translate(imgCanvas.width/2, imgCanvas.height/2);
    ictx.scale(scale,scale);
    ictx.rotate(rot*Math.PI/180);
    ictx.transform(1,0,sk,1,0,0);
    ictx.drawImage(img,-img.width/2,-img.height/2);
    ictx.restore();
}

function redrawDrawLayer(){
    dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    dctx.save();
    dctx.translate(drawCanvas.width/2, drawCanvas.height/2);
    dctx.scale(scale,scale);
    dctx.rotate(rot*Math.PI/180);
    dctx.transform(1,0,sk,1,0,0);

    // Draw all saved paths
    paths.forEach(p=>{
        dctx.strokeStyle=p.color; dctx.lineWidth=p.size; dctx.lineCap='round';
        dctx.beginPath(); p.points.forEach((pt,i)=> i==0? dctx.moveTo(pt.x,pt.y) : dctx.lineTo(pt.x,pt.y)); dctx.stroke();
    });

    // Draw all texts
    texts.forEach(t=>{
        dctx.fillStyle=t.color; dctx.font=`${t.size}px ${t.font}`; dctx.fillText(t.txt,t.x,t.y);
    });
    dctx.restore();
}

drawCanvas.onmousedown=e=>{
    if(mode!='draw') return;
    drawing=true;
    let rect = drawCanvas.getBoundingClientRect();
    let x = e.clientX - rect.left - drawCanvas.width/2;
    let y = e.clientY - rect.top - drawCanvas.height/2;
    paths.push({color:brushColor, size:brushSize, points:[{x:x/scale, y:y/scale}]});
}
drawCanvas.onmousemove=e=>{
    if(!drawing) return;
    let rect = drawCanvas.getBoundingClientRect();
    let x = e.clientX - rect.left - drawCanvas.width/2;
    let y = e.clientY - rect.top - drawCanvas.height/2;
    paths[paths.length-1].points.push({x:x/scale, y:y/scale});
    redrawDrawLayer();
}
drawCanvas.onmouseup=()=>drawing=false;

function addText(){
    let txt=prompt("Text likho:");
    if(!txt) return;
    let font=prompt("Font: Arial, Verdana, Courier", "Arial");
    let color=prompt("Color: #ffffff", "#ffffff");
    let x=0, y=-img.height/4; // top center
    texts.push({txt,x,y,size:40,font:font||'Arial',color:color||'#fff'});
    redrawDrawLayer();
}

function zoom(f){scale=Math.max(0.5, Math.min(4, scale*f)); drawImage(); redrawDrawLayer();}
function rotate(d){rot+=d; drawImage(); redrawDrawLayer();}
function skew(s){sk+=s; drawImage(); redrawDrawLayer();}

function save(){
    let temp=document.createElement('canvas');
    temp.width=img.width; temp.height=img.height;
    let tctx=temp.getContext('2d');
    tctx.drawImage(imgCanvas,0,0);
    tctx.drawImage(drawCanvas,0,0);
    let a=document.createElement('a');
    a.download="edited.jpg"; a.href=temp.toDataURL('image/jpeg',0.9); a.click();
}
</script>
</body>
</html>
