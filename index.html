<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pro Photo Editor</title>
<meta name="theme-color" content="#222">
<link rel="manifest" href="manifest.json">
<style>
    body { font-family: Arial; background: #222; color: white; margin: 0; text-align: center; overflow: hidden; }
    #canvas-container { overflow: auto; max-height: 55vh; background: #000; margin: 10px; border-radius: 10px; }
    canvas { background: #000; margin: 0; border-radius: 10px; transform-origin: 0 0; }
   .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; }
    button, input { padding: 10px 12px; border: none; border-radius: 8px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
    button:active { background: #45a049; }
    button:disabled { background: #555; }
    h2 { margin: 10px; }
</style>
</head>
<body>
    <h2>Pro Photo Editor</h2>
    <input type="file" id="upload" accept="image/*">

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="toolbar">
        <button onclick="undo()" id="undoBtn" disabled>Undo</button>
        <button onclick="redo()" id="redoBtn" disabled>Redo</button>
        <button onclick="zoom(1.2)">Zoom +</button>
        <button onclick="zoom(0.8)">Zoom -</button>
        <button onclick="rotate()">Rotate</button>
        <button onclick="flip()">Flip</button>
        <button onclick="adjust(20,0)">B+</button>
        <button onclick="adjust(-20,0)">B-</button>
        <button onclick="adjust(0,20)">C+</button>
        <button onclick="adjust(0,-20)">C-</button>
        <button onclick="filter('grayscale(100%)')">Gray</button>
        <button onclick="filter('sepia(100%)')">Sepia</button>
        <button onclick="filter('blur(3px)')">Blur</button>
        <button onclick="download()">Save</button>
        <button onclick="share()">Share</button>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');
let history = [];
let currentStep = -1;
let scale = 1;

// UPLOAD PHOTO
document.getElementById('upload').onchange = e => {
    const reader = new FileReader();
    reader.onload = event => {
        const img = new Image();
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            scale = 1;
            canvas.style.transform = `scale(${scale})`;
            saveState();
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}

// UNDO REDO SYSTEM
function saveState() {
    history = history.slice(0, currentStep + 1);
    history.push(canvas.toDataURL());
    currentStep++;
    updateButtons();
}

function updateButtons(){
    document.getElementById('undoBtn').disabled = currentStep <= 0;
    document.getElementById('redoBtn').disabled = currentStep >= history.length - 1;
}

function loadState(step){
    let img = new Image();
    img.src = history[step];
    img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img,0,0);
    }
}

function undo() {
    if(currentStep > 0){
        currentStep--;
        loadState(currentStep);
        updateButtons();
    }
}

function redo() {
    if(currentStep < history.length - 1){
        currentStep++;
        loadState(currentStep);
        updateButtons();
    }
}

// ZOOM
function zoom(factor){
    scale *= factor;
    if(scale < 0.5) scale = 0.5;
    if(scale > 4) scale = 4;
    canvas.style.transform = `scale(${scale})`;
}

// PINCH ZOOM
let touchStartDistance = 0;
container.addEventListener('touchstart', e => {
    if(e.touches.length === 2){
        touchStartDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    }
});
container.addEventListener('touchmove', e => {
    if(e.touches.length === 2){
        e.preventDefault();
        let touchEndDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        zoom(touchEndDistance / touchStartDistance);
        touchStartDistance = touchEndDistance;
    }
});

// ROTATE + FLIP
function rotate(){
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.height;
    tempCanvas.height = canvas.width;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.translate(tempCanvas.width/2, tempCanvas.height/2);
    tempCtx.rotate(90 * Math.PI/180);
    tempCtx.drawImage(canvas, -canvas.width/2, -canvas.height/2);
    canvas.width = tempCanvas.width;
    canvas.height = tempCanvas.height;
    ctx.drawImage(tempCanvas, 0, 0);
    saveState();
}

function flip(){
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.translate(canvas.width, 0);
    tempCtx.scale(-1, 1);
    tempCtx.drawImage(canvas, 0, 0);
    ctx.drawImage(tempCanvas, 0, 0);
    saveState();
}

// BRIGHTNESS + CONTRAST
function adjust(b,c){
    let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    let data = imageData.data;
    for(let i=0; i<data.length; i+=4){
        data[i] = Math.min(255, Math.max(0, data[i] + b + (data[i]-128)*c/100));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + b + (data[i+1]-128)*c/100));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + b + (data[i+2]-128)*c/100));
    }
    ctx.putImageData(imageData,0,0);
    saveState();
}

// FILTERS
function filter(type){
    ctx.filter = type;
    ctx.drawImage(canvas,0,0);
    ctx.filter = 'none';
    saveState();
}

// SAVE + SHARE
function download(){
    const link = document.createElement('a');
    link.download = 'edited.jpg';
    link.href = canvas.toDataURL("image/jpeg", 0.9);
    link.click();
}

async function share(){
    const blob = await (await fetch(canvas.toDataURL())).blob();
    const file = new File([blob], "image.jpg", {type: "image/jpeg"});
    if(navigator.share) navigator.share({files: [file]});
}

// PWA
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
