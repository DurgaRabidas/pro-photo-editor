<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Editor</title>
<style>
body { background: #121212; color: #eee; margin: 0; font-family: sans-serif; text-align: center; }
.canvas-wrap { padding: 10px; height: 70vh; display: flex; justify-content: center; align-items: center; background: #000; }
#canvas { max-width: 100%; max-height: 100%; background: #222; touch-action: none; }
.toolbar { padding: 10px; background: #1f1f1f; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
button { padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 8px; }
#upload-label { padding: 15px 30px; background: #4CAF50; border-radius: 10px; display: inline-block; margin-top: 20px; }
#upload { display: none; }
#sliderBox { display: none; background: #333; padding: 10px; }
</style>
</head>
<body>
<h2>📷 Photo Editor</h2>

<div class="canvas-wrap">
    <label for="upload" id="upload-label">📁 Choose Image</label>
    <input type="file" id="upload" accept="image/*">
    <canvas id="canvas"></canvas>
</div>

<div id="sliderBox">
    <span id="sliderLabel"></span>
    <input type="range" id="slider" min="0" max="100" value="50">
</div>

<div class="toolbar">
    <button onclick="setFilter('blur')">Blur</button>
    <button onclick="setFilter('contrast')">Contrast</button>
    <button onclick="setFilter('brightness')">Bright</button>
    <button onclick="zoom(1.2)">Zoom +</button>
    <button onclick="zoom(0.8)">Zoom -</button>
    <button onclick="download()">Save</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
let scale = 1;
let filters = {blur: 0, contrast: 100, brightness: 100};

document.getElementById('upload').onchange = e => {
    const file = e.target.files[0];
    img.onload = () => {
        document.getElementById('upload-label').style.display = 'none';
        canvas.width = img.width;
        canvas.height = img.height;
        draw();
    }
    img.src = URL.createObjectURL(file);
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.filter = `blur(${filters.blur}px) contrast(${filters.contrast}%) brightness(${filters.brightness}%)`;
    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.scale(scale, scale);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    ctx.restore();
}

function zoom(f) { scale *= f; draw(); }

function setFilter(type) {
    document.getElementById('sliderBox').style.display = 'block';
    document.getElementById('sliderLabel').innerText = type;
    document.getElementById('slider').value = filters[type];
    document.getElementById('slider').oninput = e => {
        filters[type] = e.target.value;
        draw();
    }
}

function download() {
    const link = document.createElement('a');
    link.download = 'photo.jpg';
    link.href = canvas.toDataURL();
    link.click();
}
</script>
</body>
</html>
