<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Photo Editor</title>
<meta name="theme-color" content="#222222">
<link rel="manifest" href="manifest.json">
<style>
    body { font-family: Arial; background: #222; color: white; margin: 0; text-align: center; }
    canvas { max-width: 95%; max-height: 55vh; background: #000; margin: 10px; border-radius: 10px; }
   .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; }
    button, input { padding: 10px 14px; border: none; border-radius: 8px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; }
    button:active { background: #45a049; }
    h2 { margin: 10px; }
</style>
</head>
<body>
    <h2>Pro Photo Editor</h2>
    <input type="file" id="upload" accept="image/*">
    <canvas id="canvas"></canvas>

    <div class="toolbar">
        <button onclick="rotate()">Rotate</button>
        <button onclick="flip()">Flip</button>
        <button onclick="adjust(20,0,0)">B+</button>
        <button onclick="adjust(-20,0,0)">B-</button>
        <button onclick="adjust(0,20,0)">C+</button>
        <button onclick="filter('grayscale(100%)')">Gray</button>
        <button onclick="filter('sepia(100%)')">Sepia</button>
        <button onclick="filter('blur(3px)')">Blur</button>
        <button onclick="download()">Save</button>
        <button onclick="share()">Share</button>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
let originalImg = null;

document.getElementById('upload').onchange = e => {
    const reader = new FileReader();
    reader.onload = event => {
        img.onload = () => {
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            originalImg = img;
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}

function rotate(){
    [canvas.width, canvas.height] = [canvas.height, canvas.width];
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(90 * Math.PI/180);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    ctx.setTransform(1,0,0,1,0,0);
}

function flip(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.translate(canvas.width,0); ctx.scale(-1,1);
    ctx.drawImage(img,0,0); ctx.setTransform(1,0,0,1,0,0);
}

function adjust(b,c,s){
    let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    let data = imageData.data;
    for(let i=0; i<data.length; i+=4){
        data[i] += b; data[i+1] += b; data[i+2] += b;
        data[i] = data[i] + (data[i]-128)*c/100;
    }
    ctx.putImageData(imageData,0,0);
}

function filter(type){
    ctx.filter = type;
    ctx.drawImage(canvas,0,0);
    ctx.filter = 'none';
}

function download(){
    const link = document.createElement('a');
    link.download = 'edited.jpg';
    link.href = canvas.toDataURL("image/jpeg", 0.9);
    link.click();
}

async function share(){
    const blob = await (await fetch(canvas.toDataURL())).blob();
    const file = new File([blob], "image.jpg", {type: "image/jpeg"});
    navigator.share({files: [file]});
}

// PWA ke liye
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
